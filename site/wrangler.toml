name = "befold-site"
main = "src/index.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

# *.workers.dev には Cloudflare Access が掛からないため、その経路自体を塞ぐ。
# 公開は Access を設定したカスタムドメイン経由のみとする。
workers_dev = false

# LP の CSS / JS / スクリーンショットは静的アセットとして配信する。
# ルーティングは Worker 優先（LP 本体や計測ルートは Worker が返す）。
[assets]
directory = "public"
not_found_handling = "none"
run_worker_first = false

# database_id はプレースホルダ。実デプロイ前に
# `wrangler d1 create befold-analytics` で払い出した ID に差し替える
# （ローカル開発・テストでは ID は使われない）。
[[d1_databases]]
binding = "DB"
database_name = "befold-analytics"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
