name = "befold-site"
main = "src/index.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

# 独自ドメインは使わず、Cloudflare が用意する *.workers.dev で公開する。
# workers.dev には Cloudflare Access を設定できないため、ダッシュボードは
# Worker 側の Basic 認証（シークレット DASHBOARD_PASSWORD）で保護する。
workers_dev = true

# LP の CSS / JS / スクリーンショットは静的アセットとして配信する。
# ルーティングは Worker 優先（LP 本体や計測ルートは Worker が返す）。
[assets]
directory = "public"
not_found_handling = "none"
run_worker_first = false

# database_id はプレースホルダ。実デプロイ前に
# `wrangler d1 create befold-analytics` で払い出した ID に差し替える
# （ローカル開発・テストでは ID は使われない）。
[[d1_databases]]
binding = "DB"
database_name = "befold-analytics"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
