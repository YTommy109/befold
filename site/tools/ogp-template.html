<!doctype html>
<meta charset="utf-8" />
<style>
  /* OGP 画像は撮影環境で色が変わってはいけないので、style.css の CSS 変数
     （prefers-color-scheme でダークに切り替わる）は使わず固定値で書く。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1a1a1a;
  }
  .copy {
    position: absolute;
    left: 72px;
    top: 132px;
    width: 480px;
  }
  .name {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #0066cc;
  }
  .tagline {
    margin-top: 28px;
    font-size: 52px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.02em;
  }
  .meta {
    margin-top: 36px;
    font-size: 24px;
    color: #555;
  }
  .shot {
    position: absolute;
    left: 560px;
    top: 96px;
    width: 720px;
    border-radius: 12px;
    border: 1px solid #e0e0e0;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
  }
</style>
<div class="copy">
  <div class="name">befold</div>
  <div class="tagline">Move through Markdown.</div>
  <div class="meta">macOS 14+ · Free</div>
</div>
<img class="shot" src="../public/images/screenshot-1.png" alt="" />
