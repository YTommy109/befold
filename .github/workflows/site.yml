name: Site CI

# 配布サイト Worker (site/) の検証。ci.yml とは別ワークフローにしている。
# ci.yml は on.paths が BefoldApp/** に絞られており job を足しても site/ の
# 変更では起動せず、paths に site/** を足すと site だけの変更で高コストな
# macOS ランナー(swift build / test)まで走ってしまうため。
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      # deploy ジョブが実行時に依存するスクリプト。ここに含めないと安全装置を
      # 変更しても CI が回らず、壊れても次の site/ 変更まで気づけない。
      # scripts/** ではなく個別指定にしているのは、worktree-clean.sh などの
      # 無関係なスクリプト変更で本番デプロイを走らせないため。
      - 'scripts/check-destructive-migrations.sh'
      # 上記スクリプトが source する共通処理。同じ理由でここに含める。
      - 'scripts/lib/d1-pending-migrations.sh'
      # ページの記載（対応ファイルタイプ表・ショートカット表）のずれ検知が
      # 情報源として読む実装。ここに含めないと Swift 側だけを変えたときに
      # 検証が回らず、次の site/ 変更まで乖離に気づけない。
      # MainMenuBuilder は file_length 対策で +ViewMenu.swift へ分割されるため
      # glob で拾う（vitest.config.ts も MainMenuBuilder*.swift を全件読む）。
      - 'BefoldApp/BefoldKit/FileType.swift'
      - 'BefoldApp/BefoldKit/ContentLoader.swift'
      - 'BefoldApp/BefoldKit/NormalizedTextCache.swift'
      - 'BefoldApp/befold/App/MainMenuBuilder*.swift'
      - 'BefoldApp/befold/App/BookmarkShortcut.swift'
      # 表示モードの ⌘1〜⌘3 の解決に使う参照先（vitest.config.ts が読む）。
      - 'BefoldApp/befold/App/ViewerDisplayMode.swift'
      - 'BefoldApp/befold/App/ModeSegments.swift'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      # deploy ジョブが実行時に依存するスクリプト。ここに含めないと安全装置を
      # 変更しても CI が回らず、壊れても次の site/ 変更まで気づけない。
      # scripts/** ではなく個別指定にしているのは、worktree-clean.sh などの
      # 無関係なスクリプト変更で本番デプロイを走らせないため。
      - 'scripts/check-destructive-migrations.sh'
      # 上記スクリプトが source する共通処理。同じ理由でここに含める。
      - 'scripts/lib/d1-pending-migrations.sh'
      # ページの記載（対応ファイルタイプ表・ショートカット表）のずれ検知が
      # 情報源として読む実装。ここに含めないと Swift 側だけを変えたときに
      # 検証が回らず、次の site/ 変更まで乖離に気づけない。
      # MainMenuBuilder は file_length 対策で +ViewMenu.swift へ分割されるため
      # glob で拾う（vitest.config.ts も MainMenuBuilder*.swift を全件読む）。
      - 'BefoldApp/BefoldKit/FileType.swift'
      - 'BefoldApp/BefoldKit/ContentLoader.swift'
      - 'BefoldApp/BefoldKit/NormalizedTextCache.swift'
      - 'BefoldApp/befold/App/MainMenuBuilder*.swift'
      - 'BefoldApp/befold/App/BookmarkShortcut.swift'
      # 表示モードの ⌘1〜⌘3 の解決に使う参照先（vitest.config.ts が読む）。
      - 'BefoldApp/befold/App/ViewerDisplayMode.swift'
      - 'BefoldApp/befold/App/ModeSegments.swift'

# 連続 push / force-push で古い実行を打ち切る
concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 依存をインストールする
        run: npm ci

      # 型エラーは安価に落ちるのでテストより先に回す
      - name: 型チェックを実行する
        run: npm run typecheck

      # vitest は @cloudflare/vitest-pool-workers で workerd を起動し、
      # テスト専用の D1 に migrations/ を適用して実行する
      - name: テストを実行する
        run: npm test

  # main へのマージで本番へ反映する。手作業では順序を守り続けられないため
  # CI に固定する。マイグレーションを先に当てないと新コードの INSERT が
  # カラム不足で失敗し、insertEvent は例外を飲む設計なので計測が無言で欠落する。
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # 同時実行を 1 本に絞る。並行デプロイでマイグレーションと Worker の
    # 版が食い違うのを防ぐため、test 側の concurrency とは別グループにする。
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 依存をインストールする
        run: npm ci

      # 取り返しのつかない適用を CI に任せない歯止め。未適用のマイグレーションに
      # DROP / RENAME / DELETE / TRUNCATE が含まれていたらここで落ちる。
      # 手動適用すれば未適用でなくなり、次回から通る。
      - name: 破壊的なマイグレーションが無いか確認する
        working-directory: .
        run: scripts/check-destructive-migrations.sh

      - name: D1 マイグレーションを適用する
        run: npm run migrate:remote

      - name: Worker をデプロイする
        run: npm run deploy
