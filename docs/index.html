<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>befold — 移転しました</title>
  <meta name="description" content="befold の紹介ページは https://befold.degino.com/ へ移転しました。">
  <!--
    紹介 LP の実体は site/ の Cloudflare Worker に移した。ここはリダイレクト専用。
    GitHub Pages は静的ホスティングで 301 を返せないため、meta refresh と JS の
    両方を置き、どちらも効かない場合に手動リンクが残るようにしている。
    ?ref=gh-pages は配布サイト側で Pages 経由の流入を数えるための印。
  -->
  <meta http-equiv="refresh" content="0; url=https://befold.degino.com/?ref=gh-pages">
  <link rel="canonical" href="https://befold.degino.com/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f6f7f9;
      color: #24292f;
      text-align: center;
      line-height: 1.7;
    }

    main { padding: 2rem; }

    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }

    a { color: #0969da; }

    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      a { color: #4493f8; }
    }
  </style>
</head>
<body>

<main>
  <h1>befold</h1>
  <p>紹介ページは移転しました。</p>
  <p>
    <a href="https://befold.degino.com/?ref=gh-pages">https://befold.degino.com/</a>
  </p>
</main>

<script>
  // meta refresh は履歴に残るブラウザがあるため、JS が使えるときは replace で置き換える。
  location.replace('https://befold.degino.com/?ref=gh-pages');
</script>

</body>
</html>
