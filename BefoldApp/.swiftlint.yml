excluded:
  - .build
  - befold/Resources

cyclomatic_complexity:
  warning: 10
  error: 20

function_body_length:
  warning: 50
  error: 100

file_length:
  warning: 400
  error: 1000

type_body_length:
  warning: 250
  error: 350

line_length:
  warning: 120
  error: 200
  ignores_comments: true

# SwiftFormat の trailingCommas（末尾カンマ付与）と方向を揃える
trailing_comma:
  mandatory_comma: true

identifier_name:
  excluded:
    - fd  # ファイルディスクリプタの慣用名

# モデル型のネスト（GitHubRelease.Asset など）を許容する
nesting:
  type_level: 2

custom_rules:
  # `.timeLimit` を直書きすると、CI 側で BEFOLD_TEST_TIMEOUT_SECONDS を延長しても
  # 打ち切りが追随せず「予算を使い切る前に打ち切られる」矛盾が起きる。
  # thread-sanitizer ジョブ（予算 120 秒・打ち切り 60 秒）で 8 回連続の赤になった。
  # 打ち切りは BefoldTestSupport の testTimeLimit() から導くこと。
  hardcoded_time_limit:
    name: "ハードコードされた .timeLimit"
    included: ".*Tests\\.swift"
    regex: '\.timeLimit\(\.'
    message: "テストの打ち切りは testTimeLimit() を使う（BefoldTestSupport/Waiting.swift）"
    severity: error

  # ゲート値は composition root（配線点）で 1 度だけ読み、以降は引数で渡す。
  # 直読みした箇所は OFF 側（stable）の挙動をユニットテストできなくなる。
  # 方針は .claude/CLAUDE.md に明文化済みだったが、同じブランチで 3 箇所が違反した
  # （TASK-373）ため lint で強制する。excluded は配線点の allowlist であり、
  # FeatureGateEnumerationTests が「実際に参照しているファイル集合」と一致することを
  # 検証している（stale なエントリ・先回りの追加は落ちる）。
  # 判定はコメント中の言及も含む（列挙テストと同じ substring 判定に揃えるため）。
  feature_gate_direct_reference:
    name: "FeatureGate の直接参照"
    included: "BefoldApp/befold/.*\\.swift$"
    excluded:
      - "BefoldApp/befold/App/FeatureGate\\.swift$"
      - "BefoldApp/befold/App/MainMenuBuilder\\.swift$"
      - "BefoldApp/befold/App/MainMenuBuilder\\+ViewMenu\\.swift$"
      - "BefoldApp/befold/App/ModeSegments\\.swift$"
      - "BefoldApp/befold/App/PerFileStateStore\\.swift$"
      - "BefoldApp/befold/App/SidebarDisplayPreference\\.swift$"
      - "BefoldApp/befold/App/ViewerWindowController\\+Assembly\\.swift$"
      - "BefoldApp/befold/App/ViewerWindowController\\+DiffPresentation\\.swift$"
      - "BefoldApp/befold/App/ViewerWindowManager\\.swift$"
    regex: 'FeatureGate\.'
    message: "ゲート値は配線点で読み、引数で注入する（.claude/CLAUDE.md「フィーチャーゲート」節）"
    severity: error

  # libgit2 でリポジトリを開けなかったときの写像（管理外＝確定・キャッシュ可 /
  # 使用不可＝不明・キャッシュ不可）を 1 箇所に保つ。partial clone・reftable・未知の
  # `extensions.*` はいずれも同じエラーへ収束するため、判定が散ると必ずどこかで
  # 「不明」を「確定」として覚え、一時的な失敗が固定化する（ADR 0005 の Fallback 節）。
  # libgit2 の他の API（status / diff / worktree など）は各実装が直接呼んでよい。
  # 禁止するのは「開く」ことだけ。
  git_repository_open_outside_git_library:
    name: "GitLibrary 以外でのリポジトリオープン"
    included: "BefoldApp/befold/.*\\.swift$"
    excluded:
      - "BefoldApp/befold/App/GitLibrary\\.swift$"
    regex: 'git_repository_open'
    message: "リポジトリを開くのは GitLibrary.withRepository(at:_:) だけ（ADR 0005）"
    severity: error

  # 上限なしの `DispatchSemaphore.wait()` は、待つ間そのスレッドを協調スレッド
  # プールから外す。プール幅はコア数で決まるため、ローカル（10 コア）では表面化
  # せず、CI の macOS ランナー（3〜4 コア）で埋まり切るとテストプロセス全体が
  # 停止する（TASK-424。2026-08-07 / 08-09 の CI が数十分〜数時間ハングした）。
  # 予算付きで待って超過を失敗として記録する waitOrRecordTimeout を使うこと
  # （BefoldTestSupport/BlockingWait.swift）。`await` を伴う AsyncGate.wait() は
  # スレッドを塞がないため対象外。
  unbounded_semaphore_wait:
    name: "上限のない同期待機"
    included: "BefoldApp/.*Tests.*\\.swift$"
    excluded:
      # 非協調の DispatchQueue.global ワーカーを意図的に飽和させるテスト。
      # defer で投げた本数だけ signal するため回収が保証されている。
      - "BefoldApp/befoldTests/GitCommandRunnerTests\\.swift$"
    regex: '(?<!await )\b[A-Za-z_]\w*\??\.wait\(\)'
    message: "waitOrRecordTimeout を使う（BefoldTestSupport/BlockingWait.swift）"
    severity: error
