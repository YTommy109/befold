name: befold
options:
  bundleIdPrefix: com.degino
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.5"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.0.0"
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.5.0"
  # git 連携の実体。libgit2 の C ソースを SPM ターゲットとしてビルドするパッケージで、
  # プリビルドの XCFramework ではないため cmake を必要としない。
  # Package.swift 側と同じ pin を書く（ずれるとビルド系で挙動が変わる）。
  libgit2:
    url: https://github.com/ibrahimcetin/libgit2.git
    exactVersion: "1.9.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # バージョンは全ターゲット共通の 1 か所だけで持つ。appex の
    # CFBundleVersion / CFBundleShortVersionString はアプリ本体と一致している必要があり
    # (不一致だと ValidateEmbeddedBinary が警告し、公証で弾かれる)、
    # ターゲットごとに書くとドリフトする。scripts/bump.sh もこの 1 行を書き換える。
    # BefoldCLI/AppVersion.swift の `AppVersion.current` と値を一致させる
    # (BefoldCLICommandTests.projectYmlMarketingVersionMatchesAppVersionConstant で照合)
    MARKETING_VERSION: "1.12.2"
    CURRENT_PROJECT_VERSION: "1303"
schemes:
  befold:
    build:
      targets:
        befold: all
    run:
      config: Debug
    test:
      config: Debug
      coverageEnabled: false
      targets:
        - befoldTests
  befold-cli:
    build:
      targets:
        befold-cli: all
    run:
      config: Debug
targets:
  BefoldKit:
    type: framework
    platform: macOS
    sources:
      - path: BefoldKit
        excludes:
          - "Resources/**"
      - path: BefoldKit/Resources
        buildPhase: resources
        excludes:
          - "__tests__/**"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.degino.befold.kit
      PRODUCT_NAME: BefoldKit
      GENERATE_INFOPLIST_FILE: true
  BefoldRenderKit:
    type: framework
    platform: macOS
    sources:
      - path: BefoldRenderKit
    dependencies:
      - target: BefoldKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.degino.befold.renderkit
      PRODUCT_NAME: BefoldRenderKit
      GENERATE_INFOPLIST_FILE: true
  BefoldCLI:
    type: framework
    platform: macOS
    sources:
      - path: BefoldCLI
    dependencies:
      - target: BefoldKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.degino.befold.cli
      PRODUCT_NAME: BefoldCLI
      GENERATE_INFOPLIST_FILE: true
  BefoldQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: BefoldQuickLook
        excludes:
          - Info.plist
          - BefoldQuickLook.entitlements
    dependencies:
      - target: BefoldKit
        embed: false
      - target: BefoldRenderKit
        embed: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.degino.befold.quicklook
      PRODUCT_NAME: BefoldQuickLook
      INFOPLIST_FILE: BefoldQuickLook/Info.plist
      CODE_SIGN_ENTITLEMENTS: BefoldQuickLook/BefoldQuickLook.entitlements
      ENABLE_HARDENED_RUNTIME: true
      GENERATE_INFOPLIST_FILE: false
      SKIP_INSTALL: true
      # フレームワークは befold.app の Contents/Frameworks に同梱されるため、
      # appex 実行ファイル(Contents/PlugIns/*.appex/Contents/MacOS/)から
      # 4 階層上のアプリバンドル直下を辿って参照する。
      LD_RUNPATH_SEARCH_PATHS:
        - "@executable_path/../../../../Frameworks"
  # git_libgit2_opts（C 可変長引数）を Swift から呼ぶための薄い C シム。
  # Swift と C は同一ターゲットに混在させられない（SwiftPM の制約）ため独立させる。
  # `import CGitShim` を成立させる module.modulemap は CGitShim/include に置き、
  # 利用側の SWIFT_INCLUDE_PATHS でそのディレクトリを指す。
  CGitShim:
    type: library.static
    platform: macOS
    sources:
      - path: CGitShim
    dependencies:
      - package: libgit2
    settings:
      PRODUCT_NAME: CGitShim
      DEFINES_MODULE: false
      # Xcode の SPM 統合は、C ターゲットへ依存パッケージのヘッダ検索パスを
      # 自動では通さない（SwiftPM ビルドでは通る）。libgit2 のチェックアウトは
      # DerivedData の SourcePackages 配下に置かれ、その位置は -derivedDataPath を
      # 変えても BUILD_DIR からの相対では変わらない。
      HEADER_SEARCH_PATHS:
        - "$(BUILD_DIR)/../../SourcePackages/checkouts/libgit2/include"
  befold:
    type: application
    platform: macOS
    sources:
      - path: befold
        excludes:
          - "Resources/**"
          - Info.plist
          - befold.entitlements
      - path: befold/Resources
        buildPhase: resources
        excludes:
          - "viewer.html"
          - "viewer-bundle.js"
          - "style.css"
          - "mermaid.min.js"
          - "github.css"
          - "github-dark.css"
          - "github-markdown.css"
    dependencies:
      - target: BefoldKit
      - target: BefoldRenderKit
      - target: BefoldCLI
      # CLI 実行ファイルを Contents/MacOS へ同梱する。CLIInstaller が設置する
      # /usr/local/bin/befold の symlink 先がここになる (CLIInstaller.targetExecutablePath)。
      # link: false — アプリ本体にリンクするのではなく、成果物として持ち運ぶだけ。
      # codeSign: true — XcodeGen は executable の codeSignOnCopy を既定で無効にするため明示する
      #   (無効のままだと codesign --verify --deep が公証前に落ちる)。
      - target: befold-cli
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
      # QuickLook 拡張を Contents/PlugIns へ同梱する。
      - target: BefoldQuickLook
        embed: true
        link: false
        codeSign: true
      - package: Sparkle
      # git 連携は本体アプリだけが使う。QuickLook 拡張・CLI へは入れない。
      - target: CGitShim
      - package: libgit2
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.degino.befold
      PRODUCT_NAME: befold
      SWIFT_INCLUDE_PATHS: "$(SRCROOT)/CGitShim/include"
      INFOPLIST_FILE: befold/Info.plist
      CODE_SIGN_ENTITLEMENTS: befold/befold.entitlements
      ENABLE_HARDENED_RUNTIME: true
      GENERATE_INFOPLIST_FILE: false
  befoldTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - befoldTests
    dependencies:
      - target: befold
      - target: BefoldKit
      - target: BefoldRenderKit
    settings:
      BUNDLE_LOADER: "$(TEST_HOST)"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/befold.app/Contents/MacOS/befold"
      GENERATE_INFOPLIST_FILE: true
  befold-cli:
    type: tool
    platform: macOS
    sources:
      - path: befold-cli
    dependencies:
      - target: BefoldCLI
      - target: BefoldKit
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      PRODUCT_NAME: befold-cli
      # befold.app に同梱して配布するため、アプリ本体と同じく Hardened Runtime を有効にする
      # (無効な Mach-O が 1 つでも含まれると公証が通らない)。
      ENABLE_HARDENED_RUNTIME: true
